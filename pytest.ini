[pytest]
# `live` = tests/live/test_cloud_render_live_smoke.py (rents a real Vast.ai
# instance, spends real money) and tests/live/test_r2_live_smoke.py (writes
# to the real Cloudflare R2 bucket). Deselected by default so `pytest tests/`
# (make test, CI) never runs either by accident; run explicitly with
# `pytest tests/live/ -m live` after setting VAST_LIVE_TEST=1 +
# VAST_LIVE_MAX_USD, or R2_LIVE_TEST=1 (see tests/live/README.md).
markers =
    live: opt-in tests that touch a real Vast.ai instance or R2 bucket -- never run in CI
addopts = -m "not live"
