<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OpenMontage — Edit Decisions Editor</title>
<!--
  Editor "làm mẫu" cho OpenMontage.

  Mục đích: người dùng mở edit_decisions.json + video gốc, chỉnh sửa từng
  beat (scrim, card, zoom, transition...) như một bản dựng mẫu, rồi Export.
  File export chứa metadata.user_style_profile — agent đọc bản export, diff
  với bản AI đã sinh, và học phong cách của người dùng cho các lần dựng sau.

  Tự chứa 100% (không phụ thuộc mạng/server) để mở được bằng file:// —
  vì vậy giữ nguyên một file thay vì tách module JS.

  Cách dùng:
    1. Mở file này trong trình duyệt (double-click).
    2. Chọn video gốc (vd: remotion-composer/public/raw-test-1/source.mp4).
    3. Chọn edit_decisions JSON (vd: projects/raw-test-1/artifacts/edit_decisions_v3.json).
    4. Chỉnh sửa → Export → lưu vào projects/<slug>/artifacts/edit_decisions_user.json.
    5. Nói với agent: "render bản edit_decisions_user.json và học phong cách từ đó".
-->
<style>
  :root {
    --bg: #0f172a; --surface: #1e293b; --surface2: #273449;
    --text: #f8fafc; --muted: #94a3b8; --accent: #ef4444; --ok: #22c55e;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: Inter, "Segoe UI", system-ui, sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
  header { padding: 10px 16px; background: var(--surface); display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  header h1 { font-size: 16px; margin-right: 8px; }
  header label.filebtn { background: var(--surface2); border: 1px solid #334155; padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 13px; }
  header label.filebtn input { display: none; }
  header .ok { color: var(--ok); font-size: 12px; }
  button.primary { background: var(--accent); color: #fff; border: 0; padding: 8px 16px; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 13px; }
  main { flex: 1; display: flex; min-height: 0; }

  /* Preview */
  #previewPane { width: 40%; min-width: 320px; display: flex; flex-direction: column; align-items: center; padding: 12px; gap: 8px; }
  #stage { position: relative; aspect-ratio: 9/16; height: calc(100% - 90px); max-width: 100%; background: #000; border-radius: 12px; overflow: hidden; }
  #stage video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transform-origin: center; }
  #scrim { position: absolute; inset: 0; background: #0f172a; opacity: 0; pointer-events: none; }
  #cardLayer { position: absolute; inset: 0; display: flex; justify-content: center; align-items: flex-end; padding-bottom: 12%; pointer-events: none; }
  .mockcard { background: rgba(15,23,42,.72); border-left: 5px solid var(--accent); border-radius: 12px; padding: 14px 20px; max-width: 84%; text-align: center; }
  .mockcard .t { color: var(--accent); font-weight: 800; font-size: 18px; letter-spacing: .5px; }
  .mockcard .b { color: #fff; font-weight: 700; font-size: 14px; margin-top: 4px; white-space: pre-line; }
  .mockbar { height: 10px; background: #e5e7eb; border-radius: 6px; overflow: hidden; margin-top: 8px; }
  .mockbar > div { height: 100%; background: var(--accent); width: 100%; }
  #transport { display: flex; gap: 8px; align-items: center; width: 100%; font-size: 12px; color: var(--muted); }
  #transport button { background: var(--surface2); color: var(--text); border: 1px solid #334155; border-radius: 6px; padding: 4px 12px; cursor: pointer; }

  /* Timeline strip */
  #strip { display: flex; width: 100%; height: 26px; border-radius: 6px; overflow: hidden; cursor: pointer; }
  #strip .blk { height: 100%; border-right: 1px solid #0008; }
  #strip .blk.primary { background: #3b82f6; }
  #strip .blk.overlay { background: #f59e0b; }
  #strip .blk.active { outline: 2px solid #fff; outline-offset: -2px; }

  /* Beat list */
  #beatPane { flex: 1; overflow-y: auto; padding: 12px; }
  .beat { background: var(--surface); border: 1px solid #334155; border-radius: 10px; margin-bottom: 8px; padding: 10px 12px; }
  .beat.active { border-color: var(--accent); }
  .beat .head { display: flex; gap: 10px; align-items: center; cursor: pointer; font-size: 13px; }
  .beat .head .id { font-weight: 700; min-width: 80px; }
  .beat .head .time { color: var(--muted); min-width: 110px; }
  .beat .head .tag { font-size: 11px; padding: 2px 8px; border-radius: 99px; }
  .tag.primary { background: #1d4ed8; } .tag.overlay { background: #b45309; }
  .beat .body { display: none; margin-top: 10px; border-top: 1px solid #334155; padding-top: 10px; }
  .beat.open .body { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }
  .field { font-size: 12px; color: var(--muted); display: flex; flex-direction: column; gap: 4px; }
  .field input[type=text], .field textarea, .field select, .field input[type=number] {
    background: var(--surface2); color: var(--text); border: 1px solid #334155; border-radius: 6px; padding: 6px 8px; font-size: 13px; width: 100%;
  }
  .field textarea { resize: vertical; min-height: 48px; }
  .field .val { color: var(--text); font-weight: 600; }
  footer { background: var(--surface); padding: 8px 16px; font-size: 12px; color: var(--muted); display: flex; gap: 18px; flex-wrap: wrap; }
  footer b { color: var(--text); }
</style>
</head>
<body>
<header>
  <h1>🎬 OpenMontage Editor</h1>
  <label class="filebtn">📹 Chọn video gốc<input type="file" id="videoFile" accept="video/*"></label>
  <label class="filebtn">📄 Chọn edit_decisions JSON<input type="file" id="jsonFile" accept=".json"></label>
  <span class="ok" id="loadStatus"></span>
  <span style="flex:1"></span>
  <label class="field" style="flex-direction:row;align-items:center;gap:8px;font-size:12px">
    Scrim tất cả overlay: <input type="range" id="globalScrim" min="0" max="0.8" step="0.05" style="width:120px">
    <span class="val" id="globalScrimVal">–</span>
  </label>
  <button class="primary" id="exportBtn">⬇ Export JSON (bản mẫu của bạn)</button>
</header>

<main>
  <div id="previewPane">
    <div id="stage">
      <video id="vid" muted playsinline></video>
      <div id="scrim"></div>
      <div id="cardLayer"></div>
    </div>
    <div id="transport">
      <button id="playBtn">▶ Phát</button>
      <span id="timeLabel">00.0s / 00.0s</span>
      <span style="flex:1"></span>
      <span>🔵 nói trực tiếp &nbsp; 🟠 card overlay</span>
    </div>
    <div id="strip"></div>
  </div>
  <div id="beatPane"></div>
</main>

<footer>
  <span>Thời lượng overlay: <b id="statOverlay">–</b></span>
  <span>Scrim trung bình: <b id="statScrim">–</b></span>
  <span>Số card: <b id="statCards">–</b></span>
  <span>Cut có zoom: <b id="statZoom">–</b></span>
  <span style="flex:1"></span>
  <span>Export xong → lưu vào <b>projects/&lt;slug&gt;/artifacts/edit_decisions_user.json</b> rồi nhờ agent render + học phong cách</span>
</footer>

<script>
"use strict";
let ED = null;           // edit_decisions object (được sửa trực tiếp)
let beatIdx = -1;        // beat đang phát
const vid = document.getElementById("vid");
const scrim = document.getElementById("scrim");
const cardLayer = document.getElementById("cardLayer");
const strip = document.getElementById("strip");
const beatPane = document.getElementById("beatPane");

// ---------- Load ----------
document.getElementById("videoFile").onchange = (e) => {
  const f = e.target.files[0];
  if (f) { vid.src = URL.createObjectURL(f); status(); }
};
document.getElementById("jsonFile").onchange = async (e) => {
  const f = e.target.files[0];
  if (!f) return;
  ED = JSON.parse(await f.text());
  ED.cuts.sort((a, b) => a.in_seconds - b.in_seconds);
  buildUI(); status();
};
function status() {
  const s = [];
  if (vid.src) s.push("video ✓");
  if (ED) s.push(`JSON ✓ (${ED.cuts.length} beat)`);
  document.getElementById("loadStatus").textContent = s.join("  ");
}

// ---------- Mapping output-time <-> source-time ----------
function srcStart(c) {
  return c.layer === "overlay"
    ? (c.backgroundVideoStart ?? 0)
    : (c.source_in_seconds ?? 0);
}
function dur(c) { return c.out_seconds - c.in_seconds; }
function totalDur() { return ED ? Math.max(...ED.cuts.map(c => c.out_seconds)) : 0; }
function outputTime() {
  if (!ED || beatIdx < 0) return 0;
  const c = ED.cuts[beatIdx];
  return c.in_seconds + Math.max(0, vid.currentTime - srcStart(c));
}

// ---------- Playback engine: nhảy theo cut như bản dựng thật ----------
function seekBeat(i, autoplay) {
  if (!ED || !vid.src || i < 0 || i >= ED.cuts.length) return;
  beatIdx = i;
  vid.currentTime = srcStart(ED.cuts[i]);
  refreshOverlay(); highlight();
  if (autoplay) vid.play();
}
vid.addEventListener("timeupdate", () => {
  if (!ED || beatIdx < 0) return;
  const c = ED.cuts[beatIdx];
  if (vid.currentTime >= srcStart(c) + dur(c) - 0.03) {
    if (beatIdx + 1 < ED.cuts.length) seekBeat(beatIdx + 1, !vid.paused);
    else vid.pause();
  }
  refreshOverlay();
  document.getElementById("timeLabel").textContent =
    outputTime().toFixed(1) + "s / " + totalDur().toFixed(1) + "s";
});
document.getElementById("playBtn").onclick = () => {
  if (!ED || !vid.src) return alert("Chọn video + JSON trước đã.");
  if (vid.paused) { if (beatIdx < 0) seekBeat(0, true); else vid.play(); }
  else vid.pause();
  document.getElementById("playBtn").textContent = vid.paused ? "▶ Phát" : "⏸ Dừng";
};

// ---------- Preview overlay (mô phỏng gần đúng render Remotion) ----------
function refreshOverlay() {
  if (!ED || beatIdx < 0) return;
  const c = ED.cuts[beatIdx];
  // scrim
  scrim.style.opacity = c.layer === "overlay" ? (c.backgroundOverlay ?? 0.55) : 0;
  // zoom (mô phỏng tĩnh: lấy scale hoặc trung bình scaleFrom/scaleTo)
  const t = c.transform || {};
  const s = t.scale ?? ((t.scaleFrom && t.scaleTo) ? (t.scaleFrom + t.scaleTo) / 2 : 1);
  vid.style.transform = s !== 1 ? `scale(${s})` : "";
  // card
  cardLayer.innerHTML = "";
  if (c.layer !== "overlay") return;
  const card = document.createElement("div");
  card.className = "mockcard";
  if (c.type === "text_card" && c.text) {
    const [t1, ...rest] = String(c.text).split("\n");
    card.innerHTML = `<div class="t">${esc(t1)}</div>` +
      (rest.length ? `<div class="b">${esc(rest.join("\n"))}</div>` : "");
  } else if (c.type === "callout") {
    card.innerHTML = `<div class="t">${esc(c.title || "")}</div><div class="b">${esc(c.text || "")}</div>`;
  } else if (c.type === "stat_card") {
    card.innerHTML = `<div class="t" style="font-size:24px">${esc(c.stat || "")}</div><div class="b">${esc(c.subtitle || "")}</div>`;
  } else if (c.type === "progress_bar") {
    card.innerHTML = `<div class="b">${esc(c.progressLabel || c.title || "")}</div><div class="mockbar"><div style="width:${c.progress ?? 100}%"></div></div>`;
  } else {
    card.innerHTML = `<div class="b">${esc(c.type || "card")}</div>`;
  }
  cardLayer.appendChild(card);
}
function esc(s) { return String(s).replace(/[&<>"]/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[m])); }

// ---------- UI ----------
function buildUI() {
  // timeline strip
  strip.innerHTML = "";
  const T = totalDur();
  ED.cuts.forEach((c, i) => {
    const b = document.createElement("div");
    b.className = "blk " + (c.layer === "overlay" ? "overlay" : "primary");
    b.style.width = (dur(c) / T * 100) + "%";
    b.title = `${c.id} (${c.in_seconds.toFixed(1)}–${c.out_seconds.toFixed(1)}s)`;
    b.onclick = () => { seekBeat(i, false); openBeat(i); };
    strip.appendChild(b);
  });
  // beat list
  beatPane.innerHTML = "";
  ED.cuts.forEach((c, i) => beatPane.appendChild(beatRow(c, i)));
  refreshStats();
  // global scrim slider hiển thị giá trị phổ biến nhất
  const scrims = ED.cuts.filter(c => c.backgroundOverlay != null).map(c => c.backgroundOverlay);
  if (scrims.length) setGlobalScrimLabel(scrims.reduce((a, b) => a + b, 0) / scrims.length);
}

function beatRow(c, i) {
  const el = document.createElement("div");
  el.className = "beat"; el.dataset.i = i;
  const isOv = c.layer === "overlay";
  el.innerHTML = `
    <div class="head">
      <span class="id">${esc(c.id)}</span>
      <span class="time">${c.in_seconds.toFixed(1)}s → ${c.out_seconds.toFixed(1)}s</span>
      <span class="tag ${isOv ? "overlay" : "primary"}">${isOv ? (c.type || "card") : "nói trực tiếp"}</span>
      <span style="flex:1;color:var(--muted);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc((c.reason || "").split("|")[0])}</span>
    </div>
    <div class="body"></div>`;
  el.querySelector(".head").onclick = () => { seekBeat(i, false); toggleBeat(el, c); };
  return el;
}

function toggleBeat(el, c) {
  document.querySelectorAll(".beat.open").forEach(b => { if (b !== el) b.classList.remove("open"); });
  el.classList.toggle("open");
  if (el.classList.contains("open")) fillBody(el, c);
}
function openBeat(i) {
  const el = beatPane.children[i];
  el.scrollIntoView({ block: "nearest" });
  if (!el.classList.contains("open")) toggleBeat(el, ED.cuts[i]);
}

function fillBody(el, c) {
  const body = el.querySelector(".body");
  const isOv = c.layer === "overlay";
  const t = c.transform || {};
  body.innerHTML = `
    <label class="field">Layer
      <select data-k="layer">
        <option value="primary" ${!isOv ? "selected" : ""}>primary — chỉ footage</option>
        <option value="overlay" ${isOv ? "selected" : ""}>overlay — có card</option>
      </select>
    </label>
    <label class="field">Loại card
      <select data-k="type" ${!isOv ? "disabled" : ""}>
        ${["text_card", "callout", "stat_card", "progress_bar"].map(x =>
          `<option ${c.type === x ? "selected" : ""}>${x}</option>`).join("")}
      </select>
    </label>
    <label class="field">Scrim tối (${(c.backgroundOverlay ?? 0.55).toFixed(2)})
      <input type="range" data-k="backgroundOverlay" min="0" max="0.8" step="0.05" value="${c.backgroundOverlay ?? 0.55}" ${!isOv ? "disabled" : ""}>
    </label>
    <label class="field">Text card (dòng 1 = title)
      <textarea data-k="text" ${!isOv ? "disabled" : ""}>${esc(c.text || "")}</textarea>
    </label>
    <label class="field">Title (callout)
      <input type="text" data-k="title" value="${esc(c.title || "")}" ${!isOv ? "disabled" : ""}>
    </label>
    <label class="field">Zoom tĩnh (scale)
      <input type="number" data-k="transform.scale" step="0.01" min="1" max="1.6" value="${t.scale ?? ""}" placeholder="1.0 = không zoom">
    </label>
    <label class="field">Zoom động
      <select data-k="transform.animation">
        ${["", "zoom_in", "zoom_out"].map(x =>
          `<option value="${x}" ${((t.animation || "") === x) ? "selected" : ""}>${x || "không"}</option>`).join("")}
      </select>
    </label>
    <label class="field">Transition vào beat
      <select data-k="transition_in">
        ${["", "none", "fade", "slide", "wipe"].map(x =>
          `<option value="${x}" ${((c.transition_in || "") === x) ? "selected" : ""}>${x || "(hard cut)"}</option>`).join("")}
      </select>
    </label>
    <label class="field" style="flex-direction:row;align-items:center;gap:8px">
      <input type="checkbox" data-k="cardContinuation" ${c.cardContinuation ? "checked" : ""}>
      Card nối tiếp beat trước (không chạy lại animation)
    </label>`;
  body.querySelectorAll("[data-k]").forEach(inp => {
    inp.onchange = () => { applyField(c, inp); refreshOverlay(); refreshStats(); };
    if (inp.type === "range") inp.oninput = () => { applyField(c, inp); refreshOverlay(); };
  });
}

function applyField(c, inp) {
  const k = inp.dataset.k;
  let v = inp.type === "checkbox" ? inp.checked : inp.value;
  if (inp.type === "range" || inp.type === "number") v = v === "" ? null : parseFloat(v);
  if (k.startsWith("transform.")) {
    c.transform = c.transform || {};
    const sub = k.split(".")[1];
    if (v === null || v === "" ) delete c.transform[sub]; else c.transform[sub] = v;
    if (!Object.keys(c.transform).length) delete c.transform;
  } else if (k === "layer") {
    c.layer = v;
    if (v === "primary") { // bỏ card: dọn các field overlay
      delete c.type; delete c.backgroundVideo; delete c.backgroundVideoStart;
      delete c.backgroundOverlay; delete c.cardContinuation;
      if (c.source_in_seconds == null) c.source_in_seconds = c.in_seconds;
    }
    buildUI(); // tag + controls đổi
  } else if (v === "" || v === null || v === false) {
    delete c[k];
  } else {
    c[k] = v;
  }
}

// ---------- Global scrim ----------
document.getElementById("globalScrim").oninput = (e) => {
  if (!ED) return;
  const v = parseFloat(e.target.value);
  ED.cuts.forEach(c => { if (c.layer === "overlay") c.backgroundOverlay = v; });
  setGlobalScrimLabel(v); refreshOverlay(); refreshStats();
};
function setGlobalScrimLabel(v) {
  document.getElementById("globalScrim").value = v;
  document.getElementById("globalScrimVal").textContent = v.toFixed(2);
}

// ---------- Stats + style profile ----------
function computeProfile() {
  const T = totalDur();
  const ov = ED.cuts.filter(c => c.layer === "overlay");
  const ovTime = ov.reduce((a, c) => a + dur(c), 0);
  const scrims = ov.map(c => c.backgroundOverlay ?? 0.55);
  const zoomed = ED.cuts.filter(c => c.transform && (c.transform.scale > 1 || c.transform.animation));
  const trans = {};
  ED.cuts.forEach(c => { if (c.transition_in && c.transition_in !== "none") trans[c.transition_in] = (trans[c.transition_in] || 0) + 1; });
  return {
    overlay_time_ratio: +(ovTime / T).toFixed(3),
    overlay_count: ov.length,
    avg_scrim: scrims.length ? +(scrims.reduce((a, b) => a + b, 0) / scrims.length).toFixed(3) : null,
    card_types_used: [...new Set(ov.map(c => c.type))],
    zoomed_cut_ratio: +(zoomed.length / ED.cuts.length).toFixed(3),
    transitions_used: trans,
    edited_with: "tools/editor/edit-decisions-editor.html",
    edited_at: new Date().toISOString(),
  };
}
function refreshStats() {
  if (!ED) return;
  const p = computeProfile();
  document.getElementById("statOverlay").textContent = Math.round(p.overlay_time_ratio * 100) + "% thời lượng";
  document.getElementById("statScrim").textContent = p.avg_scrim ?? "–";
  document.getElementById("statCards").textContent = p.overlay_count;
  document.getElementById("statZoom").textContent = Math.round(p.zoomed_cut_ratio * 100) + "%";
}
function highlight() {
  document.querySelectorAll("#strip .blk").forEach((b, i) => b.classList.toggle("active", i === beatIdx));
  document.querySelectorAll(".beat").forEach((b, i) => b.classList.toggle("active", i === beatIdx));
}

// ---------- Export ----------
document.getElementById("exportBtn").onclick = () => {
  if (!ED) return alert("Chưa nạp JSON.");
  ED.metadata = ED.metadata || {};
  ED.metadata.user_style_profile = computeProfile();
  const blob = new Blob([JSON.stringify(ED, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "edit_decisions_user.json";
  a.click();
};
</script>
</body>
</html>
